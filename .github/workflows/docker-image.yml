---
name: 'Build forgejo_runner_container Image'
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.github/workflows/oci-build-image.yml'     
    
jobs:
  build:
    name: 'OCI'
    uses: curium-rocks/flows/.github/workflows/oci-build-image.yml@b3430421c119169f3e1e0c3cc70ebc9b4f82e039 # main
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    with:
      registry: ghcr.io/di0ik
      image_name: forgejo_runner_container

